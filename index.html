<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">

        <div id="capa-acceso-docente" style="position:fixed;inset:0;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;z-index:999999;font-family:sans-serif;padding:20px;">
        <div style="background:#1e293b;padding:32px;border-radius:12px;max-width:400px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,0.5);text-align:center;">
            <h2 style="margin-top:0;color:#38bdf8;">Acceso a Presentación</h2>
            <p style="font-size:14px;color:#cbd5e1;margin-bottom:20px;">Introduce tu correo electrónico autorizado para recibir un código de acceso.</p>
            
            <div id="paso-email">
            <input type="email" id="input-email" placeholder="tu.correo@ejemplo.com" style="width:100%;padding:12px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box;margin-bottom:12px;font-size:15px;">
            <button onclick="solicitarPin()" id="btn-pedir" style="width:100%;padding:12px;border-radius:6px;border:none;background:#0284c7;color:#fff;font-weight:bold;cursor:pointer;font-size:15px;">Enviar código PIN</button>
            </div>

            <div id="paso-pin" style="display:none;">
            <input type="text" id="input-pin" placeholder="Código de 6 dígitos" maxlength="6" style="width:100%;padding:12px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box;margin-bottom:12px;font-size:18px;text-align:center;letter-spacing:4px;">
            <button onclick="verificarPin()" id="btn-verificar" style="width:100%;padding:12px;border-radius:6px;border:none;background:#16a34a;color:#fff;font-weight:bold;cursor:pointer;font-size:15px;">Entrar a la presentación</button>
            </div>

            <p id="mensaje-estado" style="margin-top:15px;font-size:13px;color:#fbbf24;min-height:18px;"></p>
        </div>
        </div>

        <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxK43vUgWBw9cyKdkxwsaYBvbEh7BDFjnVza8gnzT0f_sNBGNN8ISJtcWnSrV1Y3g/exec";
        const NOMBRE_MODULO = "01_01"; // Debe coincidir con el nombre de la pestaña en Google Sheets

        async function solicitarPin() {
            const email = document.getElementById("input-email").value.trim();
            const msg = document.getElementById("mensaje-estado");
            const btn = document.getElementById("btn-pedir");
            if (!email) { msg.textContent = "Escribe un correo válido."; return; }

            btn.disabled = true;
            msg.textContent = "Comprobando autorización...";

            try {
            const res = await fetch(URL_APPS_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "pedir_pin", email: email, modulo: NOMBRE_MODULO })
            });
            const data = await res.json();
            msg.textContent = data.mensaje;
            if (data.ok) {
                document.getElementById("paso-email").style.display = "none";
                document.getElementById("paso-pin").style.display = "block";
            }
            } catch (e) {
            msg.textContent = "Error de conexión. Inténtalo de nuevo.";
            }
            btn.disabled = false;
        }

        async function verificarPin() {
            const email = document.getElementById("input-email").value.trim();
            const pin = document.getElementById("input-pin").value.trim();
            const msg = document.getElementById("mensaje-estado");
            const btn = document.getElementById("btn-verificar");
            if (!pin) { msg.textContent = "Introduce el código de 6 dígitos."; return; }

            btn.disabled = true;
            msg.textContent = "Verificando código...";

            try {
            const res = await fetch(URL_APPS_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "verificar_pin", email: email, pin: pin, modulo: NOMBRE_MODULO })
            });
            const data = await res.json();
            if (data.ok && data.clave) {
                msg.textContent = "¡Acceso concedido! Desbloqueando...";
                // Rellena y envía automáticamente el formulario oculto de StatiCrypt
                const inputPass = document.querySelector('input[type="password"]');
                const formPass = inputPass ? inputPass.closest('form') : null;
                if (inputPass && formPass) {
                inputPass.value = data.clave;
                document.getElementById("capa-acceso-docente").remove();
                formPass.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                }
            } else {
                msg.textContent = data.mensaje || "Código incorrecto.";
            }
            } catch (e) {
            msg.textContent = "Error al verificar el código.";
            }
            btn.disabled = false;
        }
        </script>
